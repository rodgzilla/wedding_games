<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: #fff;
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      padding-top: 24px;
      gap: 16px;
    }

    #message {
      font-size: 1rem;
      font-weight: bold;
      min-height: 1.5em;
      color: #333;
      text-align: center;
    }

    #grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row {
      display: flex;
      gap: 5px;
    }

    .tile {
      width: 56px;
      height: 56px;
      border: 2px solid #d3d6da;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
      background: #fff;
      color: #333;
      user-select: none;
    }

    .tile.filled {
      border-color: #888;
    }

    .tile.green  { background: #6aaa64; border-color: #6aaa64; color: #fff; }
    .tile.yellow { background: #c9b458; border-color: #c9b458; color: #fff; }
    .tile.grey   { background: #787c7e; border-color: #787c7e; color: #fff; }

    @keyframes flip {
      0%   { transform: scaleY(1); }
      50%  { transform: scaleY(0); }
      100% { transform: scaleY(1); }
    }
    .tile.flip { animation: flip 0.35s ease-in-out; }

    @keyframes shake {
      0%, 100%  { transform: translateX(0); }
      20%, 60%  { transform: translateX(-4px); }
      40%, 80%  { transform: translateX(4px); }
    }
    .row.shake { animation: shake 0.4s ease-in-out; }

    #keyboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      padding: 0 8px;
    }

    .keyboard-row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .key {
      height: 56px;
      min-width: 40px;
      padding: 0 6px;
      border: none;
      border-radius: 4px;
      background: #d3d6da;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      color: #333;
      user-select: none;
      touch-action: manipulation;
    }

    .key.wide { min-width: 64px; font-size: 0.75rem; }

    .key.green  { background: #6aaa64; color: #fff; }
    .key.yellow { background: #c9b458; color: #fff; }
    .key.grey   { background: #787c7e; color: #fff; }

    #replay-btn {
      display: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      background: #6aaa64;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #replay-btn:hover { background: #538d4e; }
  </style>
</head>
<body>
  <div id="message"></div>
  <div id="grid"></div>
  <div id="keyboard"></div>
  <button id="replay-btn">Rejouer</button>
  <script src="game.js"></script>
</body>
</html>
